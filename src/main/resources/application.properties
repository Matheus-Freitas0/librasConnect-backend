spring.application.name=system
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/librasconnect}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:120000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.cors.allowed-origins=${URL_CORS_PERMISSION:http://localhost:5173}
jwt.secret=${JWT_SECRET:default_jwt_secret_key_with_at_least_32_chars_123456}
app.api.max-body-bytes=4194304
app.recognizer.enabled=true
app.recognizer.max-mean-distance=0.018
app.recognizer.min-gap-next-sign=0.004
app.recognizer.dtw-max-series-points=128
app.recognizer.coarse-series-points=48
app.recognizer.coarse-top-signs=8
server.tomcat.max-http-post-size=4194304
