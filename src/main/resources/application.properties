spring.application.name=system
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/librasconnect}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.cors.allowed-origins=${URL_CORS_PERMISSION:http://localhost:5173}
jwt.secret=${JWT_SECRET:default_jwt_secret_key_with_at_least_32_chars_123456}
